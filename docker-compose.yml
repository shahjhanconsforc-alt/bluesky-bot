# bluesky-bot: the console + real Chrome - `docker compose up -d --build`.
# Settings come from backend/.env (copy backend/.env.example to start).
#
#   Console   http://<vm-ip>:4300
#
# Chrome opens headed on the VM's webtop desktop (the same Ubuntu desktop the
# other bots use): its X socket /srv/x11-shared is mounted in and DISPLAY=:1.
# MinIO is the universal one every bot shares (MINIO_URL in backend/.env):
# sessions in MINIO_SESSIONS_BUCKET, campaign messages from campaign-sms and
# pictures from campaign-media.

services:
  app:
    build: .
    image: bluesky-bot-app:latest
    container_name: bluesky-bot
    init: true
    shm_size: "512m"           # Chrome crashes tabs on Docker's 64 MB default
    mem_limit: 1400m
    stop_grace_period: 30s     # time for Chrome to close and save its profile
    env_file:
      - backend/.env
    environment:
      XBOT_HOST: 0.0.0.0
      XBOT_PORT: 4300
      XBOT_HEADLESS: "0"         # headed, on the VM desktop
      XBOT_RELOAD: "0"
      XBOT_NO_BROWSER: "1"       # don't open the console itself in Chrome
      DISPLAY: ":1"
      TZ: ${TZ:-Asia/Karachi}
    ports:
      - "4300:4300"
    volumes:
      - profiles:/app/profiles        # cached Chrome profiles (also zipped to MinIO)
      - app-data:/app/backend/data    # accounts, scraped.jsonl, screenshots
      - /srv/x11-shared:/tmp/.X11-unix  # the webtop desktop's X socket
    restart: unless-stopped

volumes:
  profiles:
  app-data:
